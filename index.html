<script>
  // 老师以后只需改这里的题目；每题必须有一个正确答案和两个不同的选项。
  const GAME = {subject:'数学', school:'小学', grade:'Y1', unit:'小学 Y1 数与运算', mode:'星星三选一', sheetEndpoint:'https://script.google.com/macros/s/AKfycbwPPbzSKCpERlMAHSF6orMHJflVjZBlzMkVCmkW0Rsll5-YEKyGmAB8xRLopJ-zUQGM/exec'};
  const questions = [
    {icon:'☀️', prompt:'6 + 3 = ?', answer:'9', options:['8','9','10']},
    {icon:'🌙', prompt:'8 + 5 = ?', answer:'13', options:['12','13','14']},
    {icon:'🪐', prompt:'12 − 4 = ?', answer:'8', options:['7','8','9']},

    {icon:'🔢', prompt:'中文「三十一」的数字是？', answer:'31', options:['13','30','31']},
    {icon:'🔢', prompt:'数字「20」的中文是？', answer:'二十', options:['十二','二十','二十二']},
    {icon:'🍀', prompt:'14 + 5 = ?', answer:'19', options:['18','19','20']},

    {icon:'🌟', prompt:'7 + 7 = ?', answer:'14', options:['13','14','15']},
    {icon:'☀️', prompt:'16 − 9 = ?', answer:'7', options:['6','7','8']},
    {icon:'🌙', prompt:'数字「0」的中文是？', answer:'零', options:['一','十','零']},
    {icon:'🔢', prompt:'中文「十八」的数字是？', answer:'18', options:['16','17','18']},
    {icon:'🛸', prompt:'11 + 6 = ?', answer:'17', options:['16','17','18']},
    {icon:'☄️', prompt:'13 − 5 = ?', answer:'8', options:['7','8','9']},
    {icon:'🌈', prompt:'9 + 9 = ?', answer:'18', options:['17','18','19']},
    {icon:'🚀', prompt:'17 − 8 = ?', answer:'9', options:['8','9','10']},

    {icon:'🪐', prompt:'20 − 3 = ?', answer:'17', options:['16','17','18']}
  ];
  const QUESTIONS_PER_RUN=24, MAP_STEPS=8;
  const $=id=>document.getElementById(id); let order=[],index=0,correct=0,mistakes=0,fuel=3,streak=0,locked=false,student='',timeLeft=300,timerId=null,startedAt=0,gameMode='normal',stars=0;
  const shuffle=list=>[...list].sort(()=>Math.random()-.5);
  function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
  function sound(ok){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.type=ok?'sine':'triangle';o.frequency.value=ok?660:190;g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.28);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.3)}catch(e){}}
  function burst(){const box=$('confetti');box.innerHTML='';for(let i=0;i<25;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'vw';p.style.background=['#ffce45','#55b9ff','#f56789','#46cf8b','#9c78ed'][i%5];p.style.setProperty('--x',(Math.random()*160-80)+'px');p.style.animationDelay=Math.random()*.15+'s';box.appendChild(p)}setTimeout(()=>box.innerHTML='',2100)}
  const planets=[{icon:'🌙',name:'月球航标'},{icon:'🛰️',name:'卫星中继站'},{icon:'☄️',name:'彗星航道'},{icon:'🛸',name:'飞碟区域'},{icon:'🌌',name:'银河航标'},{icon:'🔭',name:'观星站'},{icon:'🪐',name:'环星航标'},{icon:'🌠',name:'终点星门'}];
  const praises=['🌟 太厉害了！','🎉 完美命中！','🚀 你是数学小天才！','👏 真棒，继续前进！','💫 答对啦，能量满满！','🏆 好厉害的宇航员！'];

  function updateTimer(){const minutes=Math.floor(timeLeft/60),seconds=String(timeLeft%60).padStart(2,'0');$('timerBadge').textContent=`⏱ ${minutes}:${seconds}`}

  function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
  function startTimer(){stopTimer();timeLeft=300;updateTimer();timerId=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){stopTimer();fail('时间到！下次加快速度，重新从第一颗行星出发吧。')}},1000)}
  function updateRoute(){const map=$('spaceMap'),finished=index>=order.length;map.innerHTML='';for(let i=0;i<MAP_STEPS;i++){const planetStep=i*3,node=document.createElement('div');node.className='planet-node'+((finished||index>planetStep)?' lit':'')+(!finished&&index===planetStep?' active':'');const planet=document.createElement('span');planet.className='planet-icon';planet.textContent=planets[i].icon;planet.title=planets[i].name;planet.setAttribute('aria-label',planets[i].name);node.appendChild(planet);if(!finished&&index===planetStep){const rocket=document.createElement('span');rocket.className='rocket-marker';rocket.innerHTML=`🚀<span class="rocket-fuel">${fuelFlames()}</span>`;node.appendChild(rocket)}map.appendChild(node);if(i<MAP_STEPS-1){for(let j=1;j<=2;j++){const checkpointStep=planetStep+j,onCheckpoint=!finished&&index===checkpointStep,checkpoint=document.createElement('span');checkpoint.className='route-node'+((index>checkpointStep)?' lit':'')+(onCheckpoint?' active has-rocket':'');if(onCheckpoint){const rocket=document.createElement('span');rocket.className='rocket-marker';rocket.innerHTML=`🚀<span class="rocket-fuel">${fuelFlames()}</span>`;checkpoint.appendChild(rocket)}map.appendChild(checkpoint)}}}}
  function render(){locked=false;const q=order[index],collectMode=gameMode==='collect';$('gameHud').classList.toggle('hidden',collectMode);$('spaceMap').classList.toggle('hidden',collectMode);$('progressText').textContent=`${index+1} / ${order.length}`;$('progressFill').style.width=`${(index/order.length)*100}%`;if(!collectMode)updateRoute();$('questionText').textContent=q.prompt;$('feedback').className='feedback';$('feedback').textContent='';$('nextButton').classList.add('hidden');const choices=$('choices');choices.innerHTML='';shuffle(q.options).forEach(v=>{const b=document.createElement('button');b.className='choice';b.textContent=v;b.onclick=()=>answer(v,b);choices.appendChild(b)})}
  function answer(value,button){if(locked)return;locked=true;const q=order[index],ok=value===q.answer;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent===q.answer)b.classList.add('correct')});if(ok){correct++;streak++;let bonus=gameMode==='collect'?(stars++,updateStars(),' 收集到 1 颗星星！'):'';if(streak===3){streak=0;if(fuel<3){fuel++;bonus+=' 连续答对 3 题，恢复 1 格电量！';updateRoute()}else bonus+=' 连续答对 3 题，电量已满！'}button.classList.add('correct');$('feedback').className='feedback good';$('feedback').textContent=`${shuffle(praises)[0]} 小火箭向前飞！${bonus}`;sound(true);burst();$('nextButton').textContent=index===order.length-1?'抵达终点星门 ✨':'飞往下一座航标 →';$('nextButton').classList.remove('hidden');return}mistakes++;streak=0;fuel--;updateRoute();button.classList.add('wrong');$('feedback').className='feedback bad';$('feedback').textContent=fuel?`没关系，正确答案是「${q.answer}」。火箭停在原处，重新出题！`:`正确答案是「${q.answer}」。燃料耗尽！`;sound(false);if(fuel===0){setTimeout(fail,1100);return}setTimeout(()=>{order[index]=shuffle(questions.filter(item=>item!==q))[0];render()},1100)}
  function finish(){ stopTimer();const elapsed=Math.max(0,Math.floor((Date.now()-startedAt)/1000)),minutes=Math.floor(elapsed/60),seconds=elapsed%60,effectiveCorrect=Math.max(0,order.length-mistakes);$('progressFill').style.width='100%';index=order.length;updateRoute();$('correctCount').textContent=effectiveCorrect;$('collectedStars').textContent=stars;$('collectedStarsRow').classList.toggle('hidden',gameMode!=='collect');$('wrongCount').textContent=mistakes;$('totalCount').textContent=order.length;$('usedTime').textContent=`${minutes} 分 ${seconds} 秒`;$('resultName').textContent=student;$('endTitle').textContent=effectiveCorrect===order.length?'完美发射！':effectiveCorrect>=18?'真厉害！':'任务完成！';show('endScreen');burst();sendScore() }
  function fail(message='燃料耗尽！回到第一颗行星，带着满满 3 格燃料重新挑战吧。'){stopTimer();$('failMessage').textContent=message;show('failScreen')}
  function formatDuration(seconds){const m=Math.floor(seconds/60),s=seconds%60;return m?`${m}分${s}秒`:`${s}秒`}
  function renderLeaderboard(rows){const list=$('leaderboardList'),collectMode=gameMode==='collect';$('leaderboardTitle').textContent=collectMode?'🏆 收集星星排行榜':'🏆 正常闯关排行榜';if(!rows||!rows.length){list.innerHTML=collectMode?'<li>首位收集星星的宇航员正等待出发！</li>':'<li>首位宇航员正等待出发！</li>';return}const ranked=[...rows].sort((a,b)=>collectMode?(b.stars-a.stars||b.correct-a.correct||a.durationSeconds-b.durationSeconds):(b.correct-a.correct||a.durationSeconds-b.durationSeconds));list.innerHTML=ranked.map((row,i)=>`<li><span class="rank">#${i+1}</span><span>${collectMode?`${row.name}•${row.stars||0}颗⭐•有效答对${row.correct}/${row.total}•答错${row.wrong||0}次`:`${row.name} · 有效答对 ${row.correct}/${row.total} · 答错 ${row.wrong||0} 次`}</span><span class="leader-time">${formatDuration(row.durationSeconds)}</span></li>`).join('')}
  function loadLeaderboard(){const callback=`universeLeaderboard_${Date.now()}`,script=document.createElement('script');window[callback]=payload=>{const collectMode=gameMode==='collect',rows=((payload.table&&payload.table.rows)||[]).map(row=>{const cells=row.c||[],correct=Number(cells[1]&&cells[1].v)||0,total=Number(cells[2]&&cells[2].v)||24,storedMode=String(cells[5]&&cells[5].v||'正常闯关模式'),mode=storedMode.indexOf('收集星星玩法')===0?'收集星星玩法':'正常闯关模式',stars=Number(cells[7]&&cells[7].v)||Number((storedMode.match(/收集星星：(\d+)/)||[])[1])||0;return{name:String(cells[0]&&cells[0].v||'小小宇航员'),correct,total,wrong:Math.max(0,total-correct),durationSeconds:Number(cells[3]&&cells[3].v)||0,mode,stars}}).filter(row=>collectMode?row.mode==='收集星星玩法':row.mode!=='收集星星玩法');renderLeaderboard(rows);delete window[callback];script.remove()};script.src=`https://docs.google.com/spreadsheets/d/1lTB297Cw0hdxc9LUrH-HBKwwYoXJzWThVm2y01wHvkk/gviz/tq?tqx=out:json%3BresponseHandler:${callback}&gid=0`;script.onerror=()=>{$('leaderboardList').innerHTML='<li>排行榜暂时无法读取。</li>';delete window[callback]};document.head.appendChild(script)}
  async function sendScore(){const status=$('submitStatus'),elapsed=Math.max(0,Math.floor((Date.now()-startedAt)/1000)),effectiveCorrect=Math.max(0,order.length-mistakes);if(!GAME.sheetEndpoint){status.textContent='排行榜暂未连接。';return}status.textContent='正在记录成绩…';try{await fetch(GAME.sheetEndpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({name:student,correct:effectiveCorrect,wrong:mistakes,total:order.length,durationSeconds:elapsed,mode:gameMode==='collect'?`收集星星玩法｜收集星星：${stars}`:'正常闯关模式'})});status.textContent='成绩已记录，排行榜正在更新。';setTimeout(loadLeaderboard,800)}catch(e){status.textContent='成绩暂时无法送出，请稍后再试。'}}
  function startGame(){const nameInput=$('studentName');student=nameInput.value.trim();if(!student){nameInput.setCustomValidity('请输入你的华文姓名后才能开始游戏。');nameInput.reportValidity();nameInput.focus();return}nameInput.setCustomValidity('');$('modeName').textContent=student;show('modeScreen')}
  function startSelectedMode(mode){gameMode=mode;order=shuffle(questions).slice(0,QUESTIONS_PER_RUN);index=0;correct=0;mistakes=0;fuel=3;streak=0;stars=0;startedAt=Date.now();updateStars();show('gameScreen');startTimer();render()}
  $('startButton').onclick=startGame;$('normalModeButton').onclick=()=>startSelectedMode('normal');$('collectModeButton').onclick=()=>startSelectedMode('collect');$('nextButton').onclick=()=>{if(index<order.length-1){index++;render()}else finish()};$('restartButton').onclick=()=>{ $('studentName').value='';gameMode='normal';updateStars();show('startScreen')};$('retryButton').onclick=()=>startSelectedMode(gameMode);
</script></body></html>
